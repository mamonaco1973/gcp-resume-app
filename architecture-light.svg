<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="790" viewBox="0 0 1620 790" role="img" aria-label="A browser loads the single-page app from a public Cloud Storage bucket and signs in to Identity Platform with the Firebase Auth SDK. It calls an API Gateway that checks the Firebase ID token and forwards to the private resume-api Cloud Function, which serves every route, keeping resume text and attachments in the private media bucket and documents in Firestore. Submitting a job publishes it to the resume-job-requests topic; an Eventarc trigger pushes it to resume-worker, which fetches the posting, calls Gemini on Vertex AI to extract the job and score the resume, writes the analysis to the bucket, and records the status and token usage in Firestore."><defs><marker id="a_e_page" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a_e_auth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="a_e_api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_fn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_s3api" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a_e_row" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a_e_pub" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker><marker id="a_e_push" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker><marker id="a_e_wmd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker><marker id="a_e_fetch" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0969da"/></marker><marker id="a_e_gm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8250df"/></marker><marker id="a_e_stat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker></defs><rect width="1620" height="790" fill="#ffffff"/><path d="M600,95.0 H465" fill="none" stroke="#1a7f37" stroke-width="2" marker-end="url(#a_e_page)"/><text x="530.0" y="83.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#1a7f37" stroke="#ffffff" stroke-width="6" paint-order="stroke">GET page</text><path d="M1020,95.0 H1155" fill="none" stroke="#8250df" stroke-width="2" marker-end="url(#a_e_auth)"/><text x="1090.0" y="83.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#8250df" stroke="#ffffff" stroke-width="6" paint-order="stroke">sign in</text><path d="M810.0,150 V235" fill="none" stroke="#0969da" stroke-width="2" marker-end="url(#a_e_api)"/><text x="824.0" y="215.0" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#0969da" stroke="#ffffff" stroke-width="6" paint-order="stroke">Bearer ID token</text><path d="